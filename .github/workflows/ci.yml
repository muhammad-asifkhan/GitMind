name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (CI mode — skips network calls)
        working-directory: backend
        env:
          SMOKE_CI: "1"
        run: python smoke_test.py

      - name: Import-graph sanity check
        working-directory: backend
        env:
          SMOKE_CI: "1"
        run: |
          python -c "from main import app; print('main.app imported OK')"
          python -c "from orchestrator import graph, crisis_graph; print('graphs compile OK')"

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Production build
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build
